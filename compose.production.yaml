services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aqua_atlas
      POSTGRES_USER: aqua_atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aqua_atlas_prod_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [database]

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PUBLIC_DEPLOYMENT: "true"
      TRUST_PROXY: "true"
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: aqua_atlas
      DB_USER: aqua_atlas
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: "true"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - aqua_atlas_media:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [database]

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    expose: ["80"]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [database, edge]

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - aqua_atlas_caddy_data:/data
      - aqua_atlas_caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [edge]

networks:
  database:
    internal: true
  edge:

volumes:
  aqua_atlas_prod_data:
  aqua_atlas_media:
  aqua_atlas_caddy_data:
  aqua_atlas_caddy_config:
