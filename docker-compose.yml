services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aqua_atlas
      POSTGRES_USER: aqua_atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqua-atlas-local-dev}
    expose:
      - "5432"
    volumes:
      - aqua_atlas_db_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: aqua_atlas
      DB_USER: aqua_atlas
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aqua-atlas-local-dev}
    expose:
      - "3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  aqua_atlas_db_data:
